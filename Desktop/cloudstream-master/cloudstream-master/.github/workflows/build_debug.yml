name: Build APK

on:
  push:
    branches: [ master, feature/custom-provider ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Prerelease Debug APK
      run: ./gradlew assemblePrereleaseDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloudstream-apk
        path: app/build/outputs/apk/prerelease/debug/*.apk

    - name: Create GitHub Release & Upload APK
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "v3.0.0-dual-subs"
        prerelease: true
        title: "CloudStream Dual Subtitle Build"
        files: |
          app/build/outputs/apk/prerelease/debug/*.apk
